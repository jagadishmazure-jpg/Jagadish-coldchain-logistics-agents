[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldchain-logistics-agents"
version = "0.1.0"
description = "End-to-end cold-chain logistics AI assistant (FDE-engagement style showcase)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["coldchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
